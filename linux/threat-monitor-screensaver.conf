# Threat Monitor screensaver settings.
# A copy in ~/.config/threat-monitor-screensaver.conf overrides this file for one user.
# Changes apply at the next desktop login.

# Minutes without input before the Threat Monitor appears
START_AFTER_MIN=5

# Minutes without input before the screen switches off (0 = never)
SCREEN_OFF_AFTER_MIN=60

# Also run on VNC virtual desktops (yes/no). Off by default: nobody is usually watching them.
INCLUDE_VNC=no
